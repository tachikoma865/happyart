<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA ART | 願いを叶えるパワーアート</title>
    <meta name="description" content="毎月25日、限定3個。あなたの人生に光を灯す、願いを叶えるパワーアート。">

    <!-- Google Fonts: 高級感のあるフォントを読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- スタイルシートのリンク（後ほど作成します） -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ヘッダー：ブランドロゴのみのシンプル構成 -->
    <header>
        <div class="logo">LUMINA ART</div>
    </header>

    <main>
        <!-- セクション1：ヒーロー（コンセプト） -->
        <section id="hero">
            <div class="hero-content">
                <h1>光を、纏う。</h1>
                <p class="subtitle">1分間の瞑想が、あなたの1日を輝かせる</p>
            </div>
        </section>

        <!-- セクション2：今月の作品（3個限定） -->
        <section id="gallery">
            <h2 class="section-title">今月の結び</h2>
            <div class="art-grid">
                <!-- 作品1 -->
                <article class="art-card">
                    <div class="art-image-container">
                        <img src="power_art_dawn.png" alt="希望の夜明け" class="art-image">
                    </div>
                    <div class="art-info">
                        <h3>希望の夜明け</h3>
                        <p class="price">¥148,000 (税込)</p>
                        <p class="description">ゴールドとブルーが織りなす、新しい始まりのエネルギー。</p>
                        <a href="#" class="buy-button">この作品と対話する</a>
                    </div>
                </article>

                <!-- 作品2 -->
                <article class="art-card">
                    <div class="art-image-container">
                        <img src="power_art_silence.png" alt="静寂の守護" class="art-image">
                    </div>
                    <div class="art-info">
                        <h3>静寂の守護</h3>
                        <p class="price">¥148,000 (税込)</p>
                        <p class="description">神秘的なシルバーが心に平穏をもたらします。</p>
                        <a href="#" class="buy-button">この作品と対話する</a>
                    </div>
                </article>

                <!-- 作品3 -->
                <article class="art-card">
                    <div class="art-image-container">
                        <img src="power_art_moonlight.png" alt="豊穣の月光" class="art-image">
                    </div>
                    <div class="art-info">
                        <h3>豊穣の月光</h3>
                        <p class="price">¥148,000 (税込)</p>
                        <p class="description">満月のエネルギーが、あなたの豊かさを引き出します。</p>
                        <a href="#" class="buy-button">この作品と対話する</a>
                    </div>
                </article>
            </div>
        </section>

        <!-- セクション3：瞑想ガイド -->
        <section id="meditation">
            <h2>心を整える</h2>
            <p>作品を1分間眺め、深く呼吸してください...</p>
        </section>
    </main>

    <!-- フッター -->
    <footer>
        <p>&copy; 2026 LUMINA ART. すべての縁に感謝を。</p>
    </footer>

    <!-- スクリプトのリンク（後ほど作成します） -->
    <script src="main.js"></script>
</body>

</html>
